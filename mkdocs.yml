site_name: Build AI Agents with Microsoft Foundry
site_description: A three-hour hands-on lab for building tool-using AI agents with Microsoft Foundry and an API key.
site_url: https://microsoft.github.io/FrontierWeekHack/
repo_url: https://github.com/microsoft/FrontierWeekHack
repo_name: microsoft/FrontierWeekHack

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: Segoe UI
    code: Cascadia Code
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  logo: assets/images/favicon.svg
  favicon: assets/images/favicon.svg
  icon:
    repo: fontawesome/brands/github

extra_css:
  - overrides/stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - 🏭 Factory:
      - Overview: factory/README.md
      - Challenge 0 — Connect: factory/challenge-0-setup/README.md
      - Challenge 1 — Build Agents: factory/challenge-1-build/README.md
      - Challenge 2 — Local Workflow: factory/challenge-2-workflow/README.md
  - 📋 Claims:
      - Overview: claims/README.md
      - Challenge 0 — Connect: claims/challenge-0-setup/README.md
      - Challenge 1 — Build Agents: claims/challenge-1-build/README.md
      - Challenge 2 — Local Workflow: claims/challenge-2-workflow/README.md
  - 📞 Call Center:
      - Overview: callcenter/README.md
      - Challenge 0 — Connect: callcenter/challenge-0-setup/README.md
      - Challenge 1 — Build Agents: callcenter/challenge-1-build/README.md
      - Challenge 2 — Local Workflow: callcenter/challenge-2-workflow/README.md
